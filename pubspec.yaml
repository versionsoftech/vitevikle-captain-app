name: vite_captain
description: "Vite Captain - Smart Ride Booking & Driver Management Platform"
publish_to: 'none'

version: 1.0.2+11

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.2.2
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  flutter_contacts: ^1.1.7
  slide_to_act: ^2.0.1
  socket_io_client: ^2.0.3+1
  google_maps_flutter: ^2.6.0
  flutter_polyline_points: ^2.1.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.3.0
  provider: ^6.1.2
  webview_flutter: ^4.7.0
  flutter_html: ^3.0.0

  # Firebase
  firebase_core: ^2.25.0
  firebase_auth: ^4.17.4
  firebase_messaging: ^14.7.21

  camera: ^0.10.5+9
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  google_mlkit_face_detection: ^0.11.0
  image: ^4.2.0

  audioplayers: ^5.2.1
  url_launcher: ^6.2.6
  android_intent_plus: ^5.3.0
  package_info_plus: ^8.0.0
  flutter_local_notifications: ^17.0.0
  share_plus: ^7.2.1
  sms_autofill: ^2.4.0
  smart_auth: ^3.2.0
  razorpay_flutter: ^1.3.6
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png


flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/sounds/
    - assets/images/
    - assets/images/safety/
    - assets/images/onboarding/
    - assets/images/signin_signup/
    - assets/images/otp_verification/
    - assets/images/menu/
    - assets/images/payments/
    - assets/images/rides/
